name: Git Pull on Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (to trigger pipeline)
        uses: actions/checkout@v3

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Connect to server and pull latest code
        env:
          SSHPASS: ${{ secrets.PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ secrets.USERNAME }}@${{ secrets.HOST }} << 'EOF'
            echo "✅ Successfully connected to server"

            cd /home/graneoth/public_html

            echo "📦 Pulling latest changes from GitHub..."
            git pull origin main

            echo "🚀 Deployment complete!"
          EOF
