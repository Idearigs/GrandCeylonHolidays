name: Auto Deploy to Server Without Removing .git

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install sshpass and rsync
        run: sudo apt-get update && sudo apt-get install -y sshpass rsync

      - name: Upload files using rsync (preserve server .git)
        env:
          SSHPASS: ${{ secrets.PASSWORD }}
        run: |
          RSYNC_RSH="sshpass -e ssh -o StrictHostKeyChecking=no"

          rsync -avz \
            --exclude='.git*' \
            --exclude='.github/' \
            --exclude='README.md' \
            --exclude='deploy.yml' \
            -e "$RSYNC_RSH" ./ ${{ secrets.USERNAME }}@${{ secrets.HOST }}:/home/graneoth/public_html/
