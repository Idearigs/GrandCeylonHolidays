name: Deploy via Git Pull

on:
  push:
    branches:
      - main  # Trigger deployment only on push to main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: SSH into server and pull latest changes
        env:
          SSHPASS: ${{ secrets.PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ secrets.USERNAME }}@${{ secrets.HOST }} << 'EOF'
            echo "✅ Connected to server at $HOST"

            cd /home/graneoth/public_html

            if [ -d .git ]; then
              echo "📁 Git repository found, pulling latest changes..."
              git reset --hard HEAD
              git clean -fd
              git pull origin main
              echo "✅ Git pull completed successfully."
            else
              echo "❌ No Git repository found in target directory."
              exit 1
            fi
          EOF
